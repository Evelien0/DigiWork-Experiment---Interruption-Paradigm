<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — Calendar request</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#202124}
.shell{max-width:800px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid #dfe3e8;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
.meta{font-size:13px;color:#52606d}.subject{margin:8px 0 14px;font-size:22px}.calendar{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;min-width:560px}
.calendar th,.calendar td{border:1px solid #e1e5ea;text-align:center;padding:11px 2px}.calendar th{background:#edf2f7}.calendar td.busy{background:#f9d7d7;font-weight:bold;color:#8d2626}.calendar td.free{background:#e6f4ea;color:#276642}
.scroll{overflow-x:auto}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:8px;background:#125ad1;color:white;padding:12px 21px;font-weight:bold;cursor:pointer}button.secondary{background:#434e61}button:disabled{opacity:.55;cursor:not-allowed}#status{margin-top:12px;color:#52606d;font-size:13px}.hint{font-size:13px;color:#52606d}
</style>
</head>
<body>
<main class="shell">
<section class="card"><div class="meta">Inbox • New message</div><h1 class="subject">Meeting request</h1><div class="meta">From: Alex (colleague)</div><p id="email-text"></p></section>
<section class="card"><h2>Your work calendar</h2><p class="hint">Each cell represents one hour. Red = busy; green = available.</p><div class="scroll" id="calendar"></div><h3 id="question-text"></h3><div class="buttons"><button id="yes" type="button">Yes, I'm available</button><button id="no" class="secondary" type="button">No, I'm busy</button></div><div id="status" role="status" aria-live="polite"></div></section>
</main>
<script>
(function () {
  'use strict';
  var p = new URLSearchParams(location.search);
  var parentOrigin = p.get('parentOrigin') || '';
  var trial = p.get('trial') || '';
  var eventId = p.get('eventId') || '';
  var itemId = Number(p.get('item') || 0);
  var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
  var HOURS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
  var ALL = [];
  DAYS.forEach(function(day){HOURS.forEach(function(hour){ALL.push(day+'|'+hour);});});

  // Illustrative calendars: replace these four arrays with validated final stimuli.
  // There are eight Busy slots per calendar, distinct from the other calendars.
  var CALENDARS = [
    ['Monday|09:00','Monday|14:00','Tuesday|11:00','Tuesday|15:00','Wednesday|10:00','Thursday|13:00','Thursday|16:00','Friday|12:00'],
    ['Monday|11:00','Monday|16:00','Tuesday|09:00','Wednesday|12:00','Wednesday|15:00','Thursday|10:00','Friday|13:00','Friday|16:00'],
    ['Monday|10:00','Tuesday|12:00','Tuesday|16:00','Wednesday|09:00','Wednesday|14:00','Thursday|11:00','Friday|10:00','Friday|15:00'],
    ['Monday|13:00','Tuesday|10:00','Tuesday|14:00','Wednesday|11:00','Thursday|09:00','Thursday|15:00','Friday|09:00','Friday|14:00']
  ];

  function createItems(calendarIndex) {
    var busy = CALENDARS[calendarIndex];
    var free = ALL.filter(function(slot){return busy.indexOf(slot) === -1;});
    // Deterministic 8 free choices per calendar; sufficiently spread across weekdays.
    var selection = [1,4,8,12,17,21,26,30].map(function(i){return free[i];});
    return busy.concat(selection);
  }
  if (!Number.isInteger(itemId) || itemId < 1 || itemId > 64) {
    document.getElementById('email-text').textContent = 'Missing or invalid item ID. Open this page from Qualtrics.';
    document.getElementById('yes').disabled = true;
    document.getElementById('no').disabled = true;
    return;
  }
  var cal = Math.floor((itemId - 1) / 16);  // 0..3
  var local = (itemId - 1) % 16;             // 0..15; first 8 busy
  var slot = createItems(cal)[local];
  var day = slot.split('|')[0], time = slot.split('|')[1];
  var end = String(Number(time.slice(0,2))+1).padStart(2,'0')+':00';
  document.getElementById('email-text').textContent = 'Hi! Are you available on '+day+' from '+time+' to '+end+'? Please check your calendar and let me know.';
  document.getElementById('question-text').textContent = 'Can you attend the meeting on '+day+' at '+time+'?';

  var table = document.createElement('table'); table.className = 'calendar';
  var head = document.createElement('tr');
  ['Time'].concat(DAYS).forEach(function(s){var th=document.createElement('th');th.textContent=s;head.appendChild(th);});
  table.appendChild(head);
  HOURS.forEach(function(hour){
    var row=document.createElement('tr'), th=document.createElement('th');th.textContent=hour+'–'+String(Number(hour.slice(0,2))+1).padStart(2,'0')+':00';row.appendChild(th);
    DAYS.forEach(function(d){var td=document.createElement('td'), busy=CALENDARS[cal].indexOf(d+'|'+hour)!==-1;td.className=busy?'busy':'free';td.textContent=busy?'Busy':'Free';row.appendChild(td);});
    table.appendChild(row);
  });
  document.getElementById('calendar').appendChild(table);
  function submit(answer) {
    if (!parentOrigin || !/^https:\/\//.test(parentOrigin) || !trial || !eventId) {
      document.getElementById('status').textContent = 'Open from the Qualtrics survey to submit.';return;
    }
    document.getElementById('yes').disabled=true;document.getElementById('no').disabled=true;
    document.getElementById('status').textContent='Answer submitted. Returning to your task…';
    window.parent.postMessage({type:'DIGIWORK_INTERRUPT_ANSWER',trial:trial,eventId:eventId,itemId:itemId,answer:answer},parentOrigin);
  }
  document.getElementById('yes').addEventListener('click',function(){submit('Yes');});
  document.getElementById('no').addEventListener('click',function(){submit('No');});
})();
</script>
</body>
</html>
