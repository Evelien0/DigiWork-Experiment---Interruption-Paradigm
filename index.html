<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#202124;font-family:Arial,Helvetica,sans-serif}
.shell{max-width:900px;margin:16px auto;padding:0 12px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
.meta{font-size:13px;color:#52606d}.subject{font-size:20px;margin:8px 0}
#email-text{white-space:pre-wrap;line-height:1.45;margin-bottom:0}
#calendar-frame{overflow-x:auto;width:100%;margin-top:10px}
#calendar-frame>.cal{min-width:640px}
.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
button{background:#125ad1;color:#fff;border:0;border-radius:8px;padding:11px 19px;font-weight:bold;cursor:pointer}
button.secondary{background:#434e61}button:disabled{opacity:.55;cursor:not-allowed}
#status{font-size:13px;color:#52606d;margin-top:12px}
.question{font-size:17px}
/* Original dual-task-style calendar CSS, preserved from uploaded files */
.cal{display:grid;grid-template-columns:50px repeat(5,1fr);font:13px Arial,sans-serif;border:1px solid #ddd}
.cal .h{padding:6px;text-align:center;font-weight:bold;border-bottom:1px solid #ddd;background:#f8f9fa}
.times div{height:48px;box-sizing:border-box;font-size:11px;color:#666;text-align:right;padding-right:4px;border-top:1px solid #eee}
.day{position:relative;height:480px;border-left:1px solid #eee;background:repeating-linear-gradient(#fff 0 47px,#eee 47px 48px)}
.ev{position:absolute;left:3px;right:3px;background:#039be5;color:#fff;border-radius:4px;padding:1px 5px;font-size:12px;line-height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box;border:1px solid #fff}
.ev.s{font-size:11px;line-height:20px;padding:0 5px}
/* category colors */
.ev.mtg{background:#039be5}   /* meetings / calls */
.ev.eml{background:#f09300}   /* emails / admin */
.ev.db{background:#7b1fa2}    /* database / data work */
.ev.doc{background:#0b8043}   /* docs / reports / prep */
.ev.lunch{background:#e0e0e0;color:#555}

</style>
